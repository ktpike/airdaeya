<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airdaeium</title>

    <!-- =====================================================================
         PWA: Manifest & Theme
    ====================================================================== -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#452345">

    <!-- =====================================================================
         PWA: iOS / Apple specific
         Apple doesn't fully honour the manifest, so these tags are required
         for a proper home-screen experience on iPhone/iPad.
    ====================================================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Airdaeium">
    <link rel="apple-touch-icon" href="https://firebasestorage.googleapis.com/v0/b/airdaeya.firebasestorage.app/o/Logos%2FAirdaeium%20logo%20180.png?alt=media&token=910f26be-fbb1-459d-ae7b-65ecad30c6bc">

    <!-- =====================================================================
         PWA: General Meta
    ====================================================================== -->
    <meta name="description" content="Explore the vast lore of the Airdaeya universe.">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- =====================================================================
         Favicon & Stylesheet
    ====================================================================== -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="style.css">

    <!-- =====================================================================
         Google Analytics (gtag.js)
    ====================================================================== -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y9RDPFTGGJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Y9RDPFTGGJ');
    </script>
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <img id="airdaeium-logo" src="https://firebasestorage.googleapis.com/v0/b/airdaeya.firebasestorage.app/o/Logos%2FAirdaeium%20Logo.png?alt=media&token=5e5a4f76-286e-496c-9560-40f0423f1a01" alt="Logos/Airdaeium Logo" class="app-logo">
            <h1>Airdaeium</h1>
            <button id="theme-toggle" class="theme-toggle-button">🌙</button>
        </div>
    </header>
    
    <div class="container">
        <h1>Welcome to the Tales of Airdaeya compendium</h1>
        <p>Explore the vast lore of the Airdaeya universe!</p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-functions-compat.js"></script>

    <!-- App Script -->
    <script src="script.js"></script>

    <!-- =====================================================================
         PWA: Service Worker Registration
    ====================================================================== -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('[PWA] Service worker registered:', reg.scope))
                    .catch(err => console.warn('[PWA] Service worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
